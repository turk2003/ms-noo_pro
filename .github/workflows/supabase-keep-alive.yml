name: Supabase keep alive

on:
  schedule:
    # Run three times a day so the project consistently receives database activity.
    - cron: "17 1,9,17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Query Supabase
        env:
          PEA_KLA_SUPABASE_URL: ${{ secrets.PEA_KLA_SUPABASE_URL || secrets.SUPABASE_URL }}
          PEA_KLA_SUPABASE_ANON_KEY: ${{ secrets.PEA_KLA_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          PEA_PLD_SUPABASE_URL: ${{ secrets.PEA_PLD_SUPABASE_URL }}
          PEA_PLD_SUPABASE_ANON_KEY: ${{ secrets.PEA_PLD_SUPABASE_ANON_KEY }}
        run: |
          query_project() {
            office="$1"
            url="$2"
            anon_key="$3"

            if [ -z "$url" ] || [ -z "$anon_key" ]; then
              echo "::error::Missing Supabase repository secrets for $office"
              return 1
            fi

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 30 \
              --header "apikey: $anon_key" \
              --header "Authorization: Bearer $anon_key" \
              --header "Accept: application/json" \
              "$url/rest/v1/equipment_items?select=id&limit=1" \
              > /dev/null

            echo "$office database query completed successfully"
          }

          query_project "PEA KLA" "$PEA_KLA_SUPABASE_URL" "$PEA_KLA_SUPABASE_ANON_KEY"
          query_project "PEA PLD" "$PEA_PLD_SUPABASE_URL" "$PEA_PLD_SUPABASE_ANON_KEY"
